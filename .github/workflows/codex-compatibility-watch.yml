name: Codex compatibility watch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/codex-compatibility-watch.yml'
      - 'scripts/check-codex-compatibility.js'
      - 'scripts/add-codex-bundle.js'
      - 'src/patch/**'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: codex-compatibility-watch-${{ github.repository }}
  cancel-in-progress: false

jobs:
  inspect-official-packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run local tests
        run: npm test
      - name: Inspect official Codex VSIX packages
        run: node scripts/check-codex-compatibility.js --report "$RUNNER_TEMP/codex-compatibility.json" --proposal "$RUNNER_TEMP/codex-compatibility-proposal.json"
      - name: Add report to workflow summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/codex-compatibility.json.md" ]; then
            cat "$RUNNER_TEMP/codex-compatibility.json.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Open a compatibility review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          proposal="$RUNNER_TEMP/codex-compatibility-proposal.json"
          if [ ! -f "$proposal" ]; then
            exit 0
          fi
          node scripts/add-codex-bundle.js "$proposal"
          npm test
          npm run check
          hash="$(node -p "require(process.argv[1]).originalHash" "$proposal")"
          version="$(node -p "require(process.argv[1]).reviewedVersions[0]" "$proposal")"
          branch="automation/codex-bundle-${hash:0:12}"
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all --json number --jq 'length')"
          if [ "$existing" != "0" ]; then
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            exit 0
          fi
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/patch/bundles.json
          git commit -m "chore: review Codex $version compatibility"
          git push --set-upstream origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "chore: review Codex $version compatibility" --body-file "$RUNNER_TEMP/codex-compatibility.json.md"
      - name: Open one review issue for incompatible bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report="$RUNNER_TEMP/codex-compatibility.json"
          proposal="$RUNNER_TEMP/codex-compatibility-proposal.json"
          if [ ! -f "$report" ] || [ -f "$proposal" ]; then
            exit 0
          fi
          if node -e 'process.exit(require(process.argv[1]).requiresReview ? 0 : 1)' "$report"; then
            open_count="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'Codex compatibility review required in:title' --json number --jq 'length')"
            if [ "$open_count" = "0" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title 'Codex compatibility review required' --body-file "$RUNNER_TEMP/codex-compatibility.json.md"
            fi
          fi
